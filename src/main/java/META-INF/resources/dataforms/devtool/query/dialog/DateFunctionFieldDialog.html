<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>ExtractField設定</title>
		<meta name="description" content="${description}">
	</head>
	<body>
			<form id="dateFunctionFieldForm">
				<div class="gridLayout">
					<div class="fieldDiv">
						<div class="label"><label for="fieldId">出力フィールドID</label></div>
						<div class="field"><input type="text" id="fieldId" /></div>
					</div>
					<div class="fieldDiv">
						<div class="label"><label for="dateFieldType">取得値</label></div>
						<div class="field"><select id="dateFieldType"></select></div>
					</div>
					<div class="fieldDiv">
						<div class="label"><label for="refFieldId">参照フィールド</label></div>
						<div class="field"><select id="refFieldId"></select></div>
					</div>
					<div class="fieldDiv addValue">
						<div class="label"><label for="addValue">加算値</label></div>
						<div class="field"><input type="text" id="addValue" /></div>
					</div>
				</div>
				<div class="buttnDiv">
					<button type="button" id="okButton" class="largeButton">ＯＫ</button>
					<button type="button" id="cancelButton" class="largeButton">キャンセル</button>
				</div>
			</form>

	</body>
</html>
