<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>UploadFieldの追加コンポーネントのレイアウト</title>
	</head>
	<body>
		<div>
			<div>
				<button type="button" id='${fieldId}_sel' class='fileFieldButton'>
					<span class="ui-icon ui-icon-folder-open"></span>
				</button>
				<button type="button" id='${fieldId}_del' class='fileFieldButton'>
					<span class="ui-icon ui-icon-trash"></span>
				</button>
				<span id='${fieldId}_rcv' class='uploadReceiver' style="display: none;"></span>
				<span id='${fieldId}_selfile'></span>
				<a id='${fieldId}_link' href=''></a>
				<input type='hidden' id='${fieldId}_fn' name='${fieldId}_fn' value=''>
			</div>
			<div id="${fieldId}_pv" style="display: none;">
				<div id='${fieldId}_thm' class="preview" style='display: none; text-align:center; vertical-align:middle; border-style:solid; border-width: 1px;'>
					<img style='vertical-align:middle; cursor: pointer; width: 100%; height: auto;'/>
				</div>
				<div id="${fieldId}_vp" class="preview videoPlayer" style="display: none;">
					<video controls preload="auto"></video>
				</div>
				<div id="${fieldId}_ap" class="preview audioPlayer" style="display: none;">
					<audio controls preload="auto"></audio>
				</div>
			</div>
		</div>
	</body>
</html>
